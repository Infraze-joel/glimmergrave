<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Glimmergrave — a co-op action roguelike for 1–4 players, right in your browser." />
    <meta name="theme-color" content="#06070b" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Glimmergrave</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #06070b;
        overscroll-behavior: none;
      }
      #game-canvas {
        position: fixed;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
        outline: none;
      }
      #ui-root {
        position: fixed;
        inset: 0;
      }
    </style>
  </head>
  <body>
    <canvas id="game-canvas"></canvas>
    <div id="ui-root"></div>
    <noscript>Glimmergrave needs JavaScript.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
