# Netlify configuration: the static game client (client/dist) plus the multiplayer backend as a Netlify Server
# (netlify/server/index.mjs, reachable on the same origin under /ws/*). See README.md.
# To use an external backend instead, set VITE_SERVER_URL (wss://…) in the build environment.

[build]
  command = "npm run build:netlify"
  publish = "client/dist"

[build.environment]
  # Netlify Server requires Node.js 24 or later.
  NODE_VERSION = "24"

# No catch-all rewrite to /index.html: it would also swallow /ws/* before it reaches the server.
# The game has a single page; unknown paths get client/public/404.html, which returns to it.

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' blob: data: wss: https:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'"

# Fingerprinted bundles never change.
[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Models and sounds keep their file names, but the game requests them as `<file>?v=<content version>`
# (client/src/core/assetVersion.ts), so each URL always means the same bytes and may be cached for good.
# Never load anything from /assets/ without that version: an unversioned URL would be stuck in browser caches.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
